<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5F0E6">
  <title>Page not found | Kashaf</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="style.css">
  <style>
    .not-found { min-height: 100vh; display: grid; place-items: center; padding: 30px; text-align: center; }
    .not-found-inner { max-width: 560px; }
    .not-found-code { color: var(--brown-accent); font: 800 clamp(5rem, 20vw, 9rem)/1 var(--display); letter-spacing: -.1em; }
    .not-found h1 { margin: 20px 0 12px; font: 700 clamp(2rem, 7vw, 3rem)/1.1 var(--display); letter-spacing: -.06em; }
    .not-found p { margin: 0 auto 25px; color: var(--brown); }
  </style>
</head>
<body>
  <main class="not-found">
    <div class="not-found-inner">
      <div class="not-found-code">404</div>
      <h1>This page isn't on the map.</h1>
      <p>The page may have moved, or the address may be incorrect. Let's take you back to the portfolio.</p>
      <a class="button button-primary" href="/">Return home <span aria-hidden="true">↗</span></a>
    </div>
  </main>
</body>
</html>
